<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f36f21" />
    <title>FPTU Lost & Found</title>
    <style>
      :root {
        color: #17253a;
        background: #f5f8fb;
        font-family: Inter, Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(420px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid #cfe2f3;
        border-top: 4px solid #f36f21;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(20, 52, 87, 0.12);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.65rem;
      }
      p {
        margin: 0 0 20px;
        color: #5f728a;
        line-height: 1.65;
      }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 18px;
        color: #fff;
        background: #f36f21;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Không có kết nối</h1>
      <p>Trang hiện không thể tải dữ liệu. Hãy kết nối mạng rồi thử lại.</p>
      <button type="button" onclick="window.location.reload()">Thử lại</button>
    </main>
  </body>
</html>
